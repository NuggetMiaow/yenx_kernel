[package]
name = "yenx_kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "yenx_kernel"
test = false
bench = false

[dependencies]
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.5"
linked_list_allocator = "0.10.5"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
